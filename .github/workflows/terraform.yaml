name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"
  workflow_dispatch:
    inputs:
      action:
        description: Choose the action to perform
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

concurrency:
  group: terraform-staging-demo
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_REGION: us-east-2
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Prepare remote state bucket
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          bucket="example-voting-app-tfstate-${account}"
          if ! aws s3api head-bucket --bucket "${bucket}" 2>/dev/null; then
            aws s3api create-bucket \
              --bucket "${bucket}" \
              --region "${AWS_REGION}" \
              --create-bucket-configuration LocationConstraint="${AWS_REGION}"
          fi
          aws s3api put-bucket-versioning \
            --bucket "${bucket}" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "${bucket}" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block \
            --bucket "${bucket}" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          echo "TF_STATE_BUCKET=${bucket}" >> "${GITHUB_ENV}"

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Import resources left by the failed apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: bash import-existing.sh

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: |
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.action == 'plan'
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve
