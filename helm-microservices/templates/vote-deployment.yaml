apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - name: vote
        image: "{{ .Values.image2.repository }}:{{ .Values.image2.tag }}"
        imagePullPolicy: {{ .Values.image2.pullPolicy }}
        ports:
        - containerPort: 80
          name: vote
