dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false

controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  extraArgs:
    - --insecure
  service:
    type: ClusterIP

configs:
  params:
    server.insecure: true
