grafana:
  enabled: true
  adminPassword: prom-operator
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 1d
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi

alertmanager:
  enabled: false

nodeExporter:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
